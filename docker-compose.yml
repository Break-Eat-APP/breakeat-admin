version: '3.9'

services:
  # PostgreSQL 18 — LA MEME VERSION MAJEURE QUE LA PRODUCTION.
  #
  # Elle est restee en 16 pendant que Railway et la CI passaient en 18. Un
  # environnement local qui ne reproduit pas la production ne sert qu'a
  # donner confiance : une migration valide sur 16 peut se comporter
  # autrement sur 18, et c'est precisement ce qu'on veut attraper ici
  # plutot qu'un soir de match.
  #
  # Changer de majeure rend le volume existant ILLISIBLE : au premier
  # demarrage, supprimer le volume (`docker compose down -v`) puis rejouer
  # les migrations. C'est une base de developpement, il n'y a rien a sauver.
  postgres:
    image: postgres:18-alpine
    container_name: breakeat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: breakeat
      POSTGRES_PASSWORD: breakeat
      POSTGRES_DB: breakeat_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U breakeat -d breakeat_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: breakeat_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
