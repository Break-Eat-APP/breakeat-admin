name: Mobile Preview Build (EAS)

# Triggers:
#   - Auto on push to main when mobile code changes
#   - Manual dispatch to build any platform on demand

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-preview.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: [all, ios, android]
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'Preview build from main'

# Cancel in-flight builds when a new push arrives
concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

# LECTURE SEULE, et c'est ecrit noir sur blanc.
#
# Ce workflow n'a rien a ecrire sur GitHub : il lance un build chez Expo et
# resume ou le trouver. Le declarer evite qu'une etape ajoutee demain herite
# d'un jeton capable de pousser du code ou de fermer des issues — sur un depot
# ou le meme jeton voit tout le monorepo.
permissions:
  contents: read

jobs:
  build:
    name: EAS Preview (${{ matrix.platform }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - ${{ (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' || github.event.inputs.platform == '') && 'ios' || '' }}
          - ${{ (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all' || github.event.inputs.platform == '') && 'android' || '' }}
        exclude:
          - platform: ''

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # expo-github-action installs eas-cli and configures auth
      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Build preview APK (Android) or IPA (iOS) via EAS Build cloud
      - name: EAS Build — ${{ matrix.platform }}
        run: |
          eas build \
            --platform ${{ matrix.platform }} \
            --profile preview \
            --non-interactive \
            --message "${{ github.event.inputs.release_notes || format('Auto preview — {0}', github.sha) }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # Ou trouver le build — ECRIT DANS LE RESUME DU RUN, pas en commentaire.
      #
      # C'etait un `createCommitComment`, et il echouait a tous les coups :
      # « Resource not accessible by integration ». Le jeton d'Actions est en
      # LECTURE SEULE par defaut, et ecrire un commentaire demande
      # `contents: write`. Comme l'etape est en `if: always()`, elle partait
      # pour iOS et pour Android — deux erreurs, et le job rouge meme quand le
      # build Expo avait reussi.
      #
      # Le resume du run ne demande AUCUNE permission : c'est un fichier ou on
      # ecrit. Et il s'affiche sur la page du run, celle qu'on ouvre deja quand
      # on vient chercher son build — la ou un commentaire de commit sur `main`
      # se serait empile sans que personne ne le lise.
      - name: Ou trouver ce build
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Build ${{ matrix.platform }} — lance" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Build ${{ matrix.platform }} — ECHEC" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Le build n'est pas parti. Le journal ci-dessus dit pourquoi." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : \`$(echo '${{ github.sha }}' | cut -c1-7)\`" >> "$GITHUB_STEP_SUMMARY"
          # Le compte est `break-eat-app-spe` (app.config.js, cle `owner`), et
          # non `breakeat` : l'ancien lien du commentaire pointait dans le vide.
          echo "- QR code et telechargement : https://expo.dev/accounts/break-eat-app-spe/projects/break-eat/builds" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Le premier build prend une dizaine de minutes ; les suivants reutilisent le cache." >> "$GITHUB_STEP_SUMMARY"

  # ─── Required secret ─────────────────────────────────────────────────────
  # EXPO_TOKEN — generate at https://expo.dev/accounts/[account]/settings/access-tokens
  # Add to GitHub Secrets: Settings → Secrets → Actions → New repository secret
