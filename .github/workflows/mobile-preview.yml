name: Mobile Preview Build (EAS)

# A LA DEMANDE SEULEMENT — bouton « Run workflow ».
#
# Il partait sur CHAQUE push touchant `apps/mobile`. Deux raisons d'arreter :
#
#  · CE N'EST PAS L'APP QU'ON TESTE. Ce workflow construit le profil
#    `preview`, dont l'identifiant est `com.shapper.breakeat.preview` : une
#    application DISTINCTE, qui s'installe a cote. Ce qui va sur TestFlight,
#    c'est le profil `beta`, lance separement ;
#  · UN BUILD CLOUD SE PAIE. Deux par push — iOS et Android — pour un artefact
#    que personne n'installait.
#
# Et en echouant a chaque push, il mettait du rouge sur des commits parfaitement
# sains. Une CI qui crie pour rien, on cesse de la lire — et le jour ou elle a
# raison, personne ne regarde.
#
# Le bouton reste : Actions > Mobile Preview Build (EAS) > Run workflow.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: [all, ios, android]
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'Preview build from main'

# Cancel in-flight builds when a new push arrives
concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

# LECTURE SEULE, et c'est ecrit noir sur blanc.
#
# Ce workflow n'a rien a ecrire sur GitHub : il lance un build chez Expo et
# resume ou le trouver. Le declarer evite qu'une etape ajoutee demain herite
# d'un jeton capable de pousser du code ou de fermer des issues — sur un depot
# ou le meme jeton voit tout le monorepo.
permissions:
  contents: read

jobs:
  build:
    name: EAS Preview (${{ matrix.platform }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - ${{ (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' || github.event.inputs.platform == '') && 'ios' || '' }}
          - ${{ (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all' || github.event.inputs.platform == '') && 'android' || '' }}
        exclude:
          - platform: ''

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # LE JETON D'ABORD, LE RESTE ENSUITE.
      #
      # Sans `EXPO_TOKEN`, le build echoue de toute facon — mais il echouait
      # APRES le checkout, l'installation de Node, de pnpm et de tout le
      # monorepo : cinq minutes pour apprendre qu'un secret manque. Et le
      # message d'EAS, « An Expo user account is required to proceed », se lit
      # comme un probleme de compte plutot que comme un secret absent.
      #
      # Ici la verification coute une seconde et nomme le remede. Le jeton
      # n'est jamais affiche : on teste seulement s'il est vide.
      - name: Verifier le jeton Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "## Secret EXPO_TOKEN absent" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Aucun build ne peut partir sans lui. Pour le poser :" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "1. Creer un jeton d'acces sur https://expo.dev/accounts/break-eat-app-spe/settings/access-tokens" >> "$GITHUB_STEP_SUMMARY"
            echo "2. Depot GitHub : Settings > Secrets and variables > Actions > New repository secret" >> "$GITHUB_STEP_SUMMARY"
            echo "3. Nom exact : \`EXPO_TOKEN\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Un secret pose sur un ENVIRONNEMENT, et non sur le depot, reste invisible ici." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Le secret EXPO_TOKEN est absent ou vide — voir le resume du run."
            exit 1
          fi
          echo "Jeton Expo present."

      # UN ARBRE SALE SUR UN CHECKOUT NEUF, C'EST TOUJOURS LES FINS DE LIGNE.
      #
      # `eas.json` pose `requireCommit: true` : EAS refuse de construire si le
      # moindre fichier differe de ce qui est commite. Sur un runner Linux,
      # rien n'a ete touche — donc la seule facon d'etre sale, c'est que Git
      # RENORMALISE un fichier au checkout.
      #
      # C'est arrive le 26/10 : `brain/TASK_SUMMARY.md` etait stocke en fins de
      # ligne MIXTES (une seule ligne en LF au milieu de 2636 en CRLF, laissee
      # par un script d'edition). `.gitattributes` imposant `eol=lf`, le
      # checkout rendait un fichier tout en LF, different du blob stocke :
      # arbre sale, build refuse. Un octet, et plus aucun build EAS ne partait.
      #
      # Le message d'EAS nomme le fichier mais pas la cause, et on cherche un
      # changement qu'on n'a pas fait. Ici on dit le remede.
      - name: Verifier que l'arbre est propre
        working-directory: .
        run: |
          SALE="$(git status --porcelain)"
          if [ -n "$SALE" ]; then
            echo "## L'arbre de travail est sale sur un checkout neuf" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Personne n'a modifie ces fichiers : Git les a RENORMALISES au checkout." >> "$GITHUB_STEP_SUMMARY"
            echo "Ils sont stockes avec des fins de ligne qui contredisent \`.gitattributes\`." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$SALE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Pour les retrouver en local : \`git ls-files --eol | grep '^i/mixed'\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Pour corriger : reecrire le fichier en LF, puis le commiter." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Arbre sale au checkout (fins de ligne) — voir le resume du run."
            exit 1
          fi
          echo "Arbre propre."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # expo-github-action installs eas-cli and configures auth
      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Build preview APK (Android) or IPA (iOS) via EAS Build cloud
      - name: EAS Build — ${{ matrix.platform }}
        run: |
          eas build \
            --platform ${{ matrix.platform }} \
            --profile preview \
            --non-interactive \
            --message "${{ github.event.inputs.release_notes || format('Auto preview — {0}', github.sha) }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # Ou trouver le build — ECRIT DANS LE RESUME DU RUN, pas en commentaire.
      #
      # C'etait un `createCommitComment`, et il echouait a tous les coups :
      # « Resource not accessible by integration ». Le jeton d'Actions est en
      # LECTURE SEULE par defaut, et ecrire un commentaire demande
      # `contents: write`. Comme l'etape est en `if: always()`, elle partait
      # pour iOS et pour Android — deux erreurs, et le job rouge meme quand le
      # build Expo avait reussi.
      #
      # Le resume du run ne demande AUCUNE permission : c'est un fichier ou on
      # ecrit. Et il s'affiche sur la page du run, celle qu'on ouvre deja quand
      # on vient chercher son build — la ou un commentaire de commit sur `main`
      # se serait empile sans que personne ne le lise.
      - name: Ou trouver ce build
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Build ${{ matrix.platform }} — lance" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Build ${{ matrix.platform }} — ECHEC" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Le build n'est pas parti. Le journal ci-dessus dit pourquoi." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : \`$(echo '${{ github.sha }}' | cut -c1-7)\`" >> "$GITHUB_STEP_SUMMARY"
          # Le compte est `break-eat-app-spe` (app.config.js, cle `owner`), et
          # non `breakeat` : l'ancien lien du commentaire pointait dans le vide.
          echo "- QR code et telechargement : https://expo.dev/accounts/break-eat-app-spe/projects/break-eat/builds" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Le premier build prend une dizaine de minutes ; les suivants reutilisent le cache." >> "$GITHUB_STEP_SUMMARY"

  # ─── Required secret ─────────────────────────────────────────────────────
  # EXPO_TOKEN — generate at https://expo.dev/accounts/[account]/settings/access-tokens
  # Add to GitHub Secrets: Settings → Secrets → Actions → New repository secret
