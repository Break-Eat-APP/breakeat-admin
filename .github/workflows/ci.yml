name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.3.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm turbo lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Les types de Prisma sont GENERES : sans cette etape, `@prisma/client`
      # n'expose que son ebauche, et tout ce qui importe `OrderStatus`,
      # `OrgStatus` ou `Prisma.OrderWhereInput` ne compile pas.
      #
      # Elle n'a JAMAIS existe dans ce fichier (verifie sur tout l'historique
      # au 25/10/2026) : les jobs TypeScript et Tests echouaient donc depuis
      # toujours, et personne ne lisait la CI. `pnpm install` ne la declenche
      # pas — le hook `postinstall` ne part pas sous pnpm 11.
      - name: Generer le client Prisma
        working-directory: backend
        run: pnpm db:generate

      - name: Typecheck all packages
        run: pnpm turbo typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Les types de Prisma sont GENERES : sans cette etape, `@prisma/client`
      # n'expose que son ebauche, et tout ce qui importe `OrderStatus`,
      # `OrgStatus` ou `Prisma.OrderWhereInput` ne compile pas.
      #
      # Elle n'a JAMAIS existe dans ce fichier (verifie sur tout l'historique
      # au 25/10/2026) : les jobs TypeScript et Tests echouaient donc depuis
      # toujours, et personne ne lisait la CI. `pnpm install` ne la declenche
      # pas — le hook `postinstall` ne part pas sous pnpm 11.
      - name: Generer le client Prisma
        working-directory: backend
        run: pnpm db:generate

      - name: Run tests
        run: pnpm turbo test

  integration:
    name: Tests d'integration (base reelle)
    runs-on: ubuntu-latest
    # Les regles de suppression (CASCADE, RESTRICT, SET NULL), les index uniques
    # et les contraintes CHECK vivent dans le SQL des migrations : une doublure
    # ne les voit pas. Ces tests tournaient a la main depuis toujours, donc
    # seulement quand quelqu'un y pensait — c'est le P3 le plus rentable de
    # l'audit du 30/09.
    services:
      postgres:
        # La MEME version majeure que la production (18) : une migration
        # valide sur 16 peut se comporter autrement sur 18, et c'est
        # precisement ce que ces tests doivent attraper.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit
        ports:
          - 5432:5432
        # Sans ce controle, les migrations partent avant que Postgres accepte
        # les connexions, et l'echec ressemble a un bug applicatif.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Les MIGRATIONS de production, pas `db push` : c'est leur SQL qu'on veut
      # eprouver, y compris les contraintes que le schema Prisma n'exprime pas.
      # Les types de Prisma sont GENERES : sans cette etape, `@prisma/client`
      # n'expose que son ebauche, et tout ce qui importe `OrderStatus`,
      # `OrgStatus` ou `Prisma.OrderWhereInput` ne compile pas.
      #
      # Elle n'a JAMAIS existe dans ce fichier (verifie sur tout l'historique
      # au 25/10/2026) : les jobs TypeScript et Tests echouaient donc depuis
      # toujours, et personne ne lisait la CI. `pnpm install` ne la declenche
      # pas — le hook `postinstall` ne part pas sous pnpm 11.
      - name: Generer le client Prisma
        working-directory: backend
        run: pnpm db:generate

      - name: Appliquer les migrations
        working-directory: backend
        # Le script du depot, pas un appel direct : si la commande change un
        # jour, elle change a UN endroit.
        run: pnpm db:migrate:prod
        env:
          DATABASE_URL: postgresql://audit:audit@localhost:5432/audit

      - name: Suite d'integration
        working-directory: backend
        run: pnpm test:integration
        env:
          # Sans cette variable, la suite s'IGNORE au lieu d'echouer : elle ne
          # touche jamais une base qu'on ne lui a pas designee. La ligne
          # ci-dessous est donc ce qui fait exister ce job.
          DATABASE_URL_TEST: postgresql://audit:audit@localhost:5432/audit

  export-web:
    name: Export web de l'app client
    # Le `build` du paquet mobile n'est qu'un `tsc --noEmit` : la CI ne
    # construisait donc JAMAIS le livrable web, alors que c'est lui que Vercel
    # publie pour les clients sans application installee. Un export casse ne se
    # voyait qu'au deploiement — trop tard, et sur la branche principale.
    #
    # Job a part plutot que dans `turbo build` : l'export prend des minutes, et
    # le ralentir pour tout le monde a chaque tache ferait qu'on finirait par
    # le desactiver.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exporter le web
        working-directory: apps/mobile
        run: pnpm build:web
        env:
          # Memes valeurs que `apps/mobile/vercel.json` : on verifie l'export
          # TEL QU'IL EST PUBLIE, pas une variante de developpement. Rien de
          # secret ici — une adresse d'API publique.
          APP_ENV: production
          EXPO_PUBLIC_API_URL: https://breakeat-admin-production.up.railway.app/api/v1
          # Metro tient tout le graphe en memoire ; le defaut de Node suffit
          # rarement sur un projet de cette taille.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verifier que le livrable existe vraiment
        working-directory: apps/mobile
        # Un export peut « reussir » sans rien ecrire : c'est exactement ce que
        # l'audit du 10/10 a observe (processus interrompu a 84,6 %, aucun
        # dossier `dist/`). On exige donc la page d'entree, pas un code de sortie.
        run: test -f dist/index.html

      - name: Conserver l'export
        uses: actions/upload-artifact@v4
        with:
          name: export-web-mobile
          path: apps/mobile/dist
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo build
        env:
          NODE_ENV: production
