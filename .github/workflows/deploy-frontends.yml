name: Deploy Frontends (Vercel)

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'apps/operator/**'
      - 'pnpm-lock.yaml'
      # CE FICHIER SE SURVEILLE LUI-MEME.
      #
      # Le correctif Node 20 -> 22 n'a touche que ce workflow, donc il ne
      # figurait dans AUCUN de ses propres chemins : la correction etait
      # poussee et le deploiement restait rouge, en attendant qu'un commit
      # sans rapport vienne le reveiller.
      - '.github/workflows/deploy-frontends.yml'
  # Et un declenchement manuel, pour rejouer sans attendre un commit.
  workflow_dispatch:

jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          # 22, comme `engines.node` l'exige (>=22.13.0) et comme le fait
          # tout le reste de la CI. Ce workflow etait reste sur 20 : une
          # version non supportee par le depot lui-meme.
          node-version: '22'
          cache: 'pnpm'
      - name: Pull Vercel env
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
      - name: Build & Deploy admin
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}

  deploy-operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          # 22, comme `engines.node` l'exige (>=22.13.0) et comme le fait
          # tout le reste de la CI. Ce workflow etait reste sur 20 : une
          # version non supportee par le depot lui-meme.
          node-version: '22'
          cache: 'pnpm'
      - name: Pull Vercel env
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/operator
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_OPERATOR }}
      - name: Build & Deploy operator
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/operator
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_OPERATOR }}
