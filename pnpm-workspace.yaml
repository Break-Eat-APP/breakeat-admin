packages:
  - "backend"
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  argon2: true
  core-js-pure: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Dependance manquante chez un tiers, ajoutee a SON manifeste.
#
# @bacons/apple-targets 5.0.0 fait `require('@expo/plist')` sans le declarer :
# il comptait sur le hoisting de npm/yarn. Le SDK 57 ne le fournit plus par
# transitivite, et pnpm — qui n'expose que les dependances declarees — le fait
# echouer avec « Cannot find module '@expo/plist' ». Le plugin est alors ignore
# en silence : plus de cible Xcode pour l'extension Live Activity.
#
# Version calee sur le @expo/config-plugins 55 qu'apple-targets embarque
# lui-meme (^0.5.4) : les deux manipulent les memes plists.
#
# MEME DEFAUT, MEME REMEDE, pour `@expo/image-utils` (09/11/2026). Il etait
# trouve par chance : pnpm le remontait dans son dossier cache tant qu'expo
# etait en 57.0.16. Le rattrapage en 57.0.32 a change ce qui est remonte, et
# `expo config` echouait sur « Cannot find module '@expo/image-utils' » — une
# build lancee la aurait perdu l'extension Live Activity. Version calee sur le
# @expo/prebuild-config 55 qu'apple-targets embarque (^0.8.15), dont il
# reprend le code d'icones.
packageExtensions:
  '@bacons/apple-targets':
    dependencies:
      '@expo/plist': '^0.5.4'
      '@expo/image-utils': '^0.8.15'

# ─────────────────────────────────────────────────────────────────────────
# VULNERABILITES TRANSITIVES — corrigees sans toucher a NestJS ni a Prisma.
#
# Toutes ces failles arrivent par des dependances de dependances : on ne peut
# pas les mettre a jour directement sans faire monter leur parent, ce qui
# serait un bien plus gros changement pour un bien plus gros risque.
#
# LES PLAGES SONT BORNEES, deliberement. Un override global deplacerait des
# arbres voisins qui n'ont rien demande — `ws@7`, `brace-expansion@1` et `@5`
# cohabitent ici et doivent rester ou ils sont.
#
# A RELIRE a chaque montee de NestJS : le jour ou le parent embarque deja la
# version corrigee, l'override devient inutile et doit partir. Un override
# oublie fige une version et finit par empecher une mise a jour legitime.
overrides:
  # La seule CRITIQUE qui touche le serveur : usurpation d'IP via une adresse
  # IPv4 encapsulee en IPv6. Elle fausse tout ce qui se fie a l'IP, dont la
  # limitation de debit.
  'proxy-addr@<2.0.8': '^2.0.8'
  # Deni de service par octets residuels apres un corps compresse.
  'body-parser@>=2.0.0 <2.4.0': '^2.4.0'
  # Deni de service par noms de champs profondement imbriques.
  'multer@>=1.0.0 <2.2.0': '^2.2.0'
  # Les trois suivantes visent la couche WebSocket — celle qui porte le temps
  # reel un soir de match, quand une interruption se voit tout de suite.
  'ws@>=8.0.0 <8.21.0': '^8.21.0'
  'engine.io@>=6.6.0 <6.6.10': '^6.6.10'
  'socket.io-parser@>=4.0.0 <4.2.7': '^4.2.7'
  # Expansion exponentielle sur des accolades consecutives.
  'brace-expansion@>=2.0.0 <2.1.2': '^2.1.2'
  # Epuisement de pile sur des graphes recursifs. SAUT DE MAJEURE (7 -> 8),
  # dans le chargeur de configuration de Prisma — eprouve avant d'etre garde :
  # migrations rejouees sur une base vierge, suite complete, build.
  'deepmerge-ts@<8.0.0': '^8.0.0'
  # Injection de commande via un terminateur de ligne. Outillage de build
  # Expo : jamais expose a une requete, mais une chaine de build compromise
  # signe les binaires qui partent sur les telephones.
  'shell-quote@<1.11.0': '^1.11.0'
  # AUDIT DES DÉPENDANCES DU 12/11/2026 (BUG-2026-016) : versions corrigées,
  # TOUJOURS dans la même version majeure que celle demandée par le paquet
  # parent. Presque toutes servent à la construction (outillage Expo, Next.js,
  # greffon Sentry), aucune n'est dans le serveur. Non forcés, et pourquoi :
  # `sharp` (0.34 → 0.35, imposé par Next ; sur Vercel l'optimisation d'images
  # ne l'utilise pas) et `decode-uri-component` (0.2 → 0.5 passe en module ES,
  # que `query-string` de React Navigation ne sait pas charger) — voir
  # brain/BUGS_ET_INCIDENTS.md.
  'brace-expansion@>=1.0.0 <1.1.20': '^1.1.20'
  'brace-expansion@>=5.0.0 <5.0.11': '^5.0.11'
  'js-yaml@>=3.0.0 <3.15.2': '^3.15.2'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  '@xmldom/xmldom@>=0.8.0 <0.8.15': '^0.8.15'
  '@xmldom/xmldom@>=0.9.0 <0.9.12': '^0.9.12'
  'node-forge@>=1.0.0 <1.4.1': '^1.4.1'
  'nanoid@>=3.0.0 <3.3.18': '^3.3.18'
  'postcss@>=8.0.0 <8.5.18': '^8.5.18'
  'source-map-js@<1.2.2': '^1.2.2'
  'browserslist@>=4.0.0 <4.28.7': '^4.28.7'
  'fast-uri@>=3.0.0 <3.1.7': '^3.1.7'
  'compression@>=1.0.0 <1.8.2': '^1.8.2'

auditConfig:
  ignoreGhsas:
    - GHSA-f88m-g3jw-g9cj
    - GHSA-rgj7-g3m4-5g8c
    - GHSA-wq5f-xc86-pv6w
    - GHSA-qr28-fpjm-wq7f
